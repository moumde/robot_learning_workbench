[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-learning-workbench"
version = "1.0.0"
description = "Shared robot control, collection UI and dataset runtime"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "opencv-python>=4.8", "pyserial>=3.5", "pyarrow>=15"]

[project.scripts]
robot-workbench = "hmi.collection.__main__:main"
gello-replay = "core.workbench.replay:main"

[project.optional-dependencies]
ui = ["PySide6-Essentials>=6.7"]
hdf5 = ["h5py>=3.10"]
data-validation = ["pyarrow>=15", "av>=15,<16", "pandas>=2", "h5py>=3.10"]
dagger = ["websockets>=14", "PyYAML>=6", "msgpack>=1.0.5"]
alternative-masters = ["websocket-client>=1.8"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "core.workbench*", "core.hardware*", "hmi", "hmi.collection*", "teleop", "teleop.gello_cr*", "teleop.devices*", "config*", "vendor", "vendor.nrc_interface*", "vendor.camera*"]

[tool.setuptools.package-data]
"hmi.collection" = ["forms/*.ui", "forms/pages/*.ui", "forms/widgets/*.ui", "styles/*.qss"]
"config" = ["hardware/*.toml", "teleop/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
addopts = "-m 'not hardware'"
markers = ["hardware: explicitly selected real-device acceptance tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["hmi/collection/generated", "vendor", "module"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
