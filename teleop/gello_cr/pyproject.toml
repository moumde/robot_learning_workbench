[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gello-cr-teleop"
version = "1.0.0"
description = "Robot Learning Workbench for CR3, O6 and GELLO"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "opencv-python>=4.8", "pyserial>=3.5", "pyarrow>=15"]

[project.scripts]
gello-replay = "gello_cr.cli.replay_trajectory:main"

[project.optional-dependencies]
ui = ["PySide6-Essentials>=6.7"]
dagger = ["websockets>=14", "PyYAML>=6", "msgpack>=1.0.5"]
data-validation = ["pyarrow>=15", "av>=15,<16", "pandas>=2", "h5py>=3.10"]
hdf5 = ["h5py>=3.10"]
alternative-masters = ["websocket-client>=1.8"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not hardware'"
markers = ["hardware: explicitly selected real-device acceptance tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/gello_cr/ui/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
"gello_cr.ui" = ["forms/*.ui", "forms/pages/*.ui", "forms/widgets/*.ui", "styles/*.qss"]
